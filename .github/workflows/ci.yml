name: CI

on:
  push:
    # Upgrade/release branches get CI before a PR exists.
    branches: [main, "upgrade/**", "release/**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# A push to a branch with an open PR runs CI twice; keep only the newest run.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.head.ref || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Tests (unit + integration)
    runs-on: ubuntu-latest
    # Dummy Shopify credentials so the app environment can boot — the same
    # approach the Dockerfile uses at image-build time. Real values are never
    # needed in CI: tests HMAC-sign with whatever secret the app booted with.
    env:
      SHOPIFY_API_KEY: ci-dummy-api-key
      SHOPIFY_API_SECRET: ci-dummy-api-secret
    steps:
      - uses: actions/checkout@v7

      # No ruby-version input: setup-ruby reads .ruby-version, the same file
      # the Gemfile, Dockerfile and Dependabot resolve against.
      - uses: ruby/setup-ruby@v1
        with:
          bundler-cache: true

      - name: Prepare test database
        run: bundle exec rails db:prepare RAILS_ENV=test

      - name: Full test suite (RSpec + App Proxy integration)
        run: ruby spec/test_runner.rb

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage-report
          path: coverage/
          if-no-files-found: warn

      - name: Eager-load check (zeitwerk)
        run: bundle exec rails zeitwerk:check

  lint:
    name: RuboCop
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # No ruby-version input: setup-ruby reads .ruby-version, the same file
      # the Gemfile, Dockerfile and Dependabot resolve against.
      - uses: ruby/setup-ruby@v1
        with:
          bundler-cache: true

      - name: Lint
        run: bundle exec rubocop

  security:
    name: Dependency audit (bundler-audit + Brakeman)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # No ruby-version input: setup-ruby reads .ruby-version, the same file
      # the Gemfile, Dockerfile and Dependabot resolve against.
      - uses: ruby/setup-ruby@v1
        with:
          bundler-cache: true

      - name: bundler-audit
        run: |
          gem install bundler-audit -v 0.9.3 --no-document
          bundle audit check --update

      # Ignored warnings and the reason for each live in config/brakeman.ignore.
      # Pinned so a new Brakeman release cannot turn unrelated PRs red.
      - name: Brakeman
        run: |
          gem install brakeman -v 8.1.0 --no-document
          brakeman --quiet --no-pager

  secrets:
    name: Secret scan (gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: gitleaks (full history)
        env:
          GITLEAKS_VERSION: 8.28.0
        run: |
          base="https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}"
          tarball="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -sSfLO "$base/$tarball"
          curl -sSfL "$base/gitleaks_${GITLEAKS_VERSION}_checksums.txt" | grep " $tarball\$" | sha256sum -c -
          tar -xzf "$tarball" gitleaks
          ./gitleaks git --redact --verbose --exit-code 1 .

  docker:
    name: Docker image build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # Same image fly deploy builds; catches Dockerfile/Gemfile drift
      # (e.g. .ruby-version missing from the gem layer) before a deploy does.
      - name: docker build
        run: docker build --tag vehicle-selector-pro:ci .

  docs-links:
    name: Docs + storefront JS checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Verify README + docs links
        run: python3 scripts/check_links.py

      - name: Banner SVG is well-formed
        run: python3 -c "import xml.dom.minidom; xml.dom.minidom.parse('docs/banner.svg')"

      - name: Theme extension JS syntax check
        run: node --check extensions/vehicle-selector-pro-extension/assets/vehicle-selector.js

